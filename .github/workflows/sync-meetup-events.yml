name: Sync Meetup Events

on:
  schedule:
    # Every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Event Hub sync
        env:
          EVENT_HUB_URL: ${{ secrets.EVENT_HUB_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          curl -f -X POST "${EVENT_HUB_URL}/sync/meetup" \
            -H "Authorization: Bearer ${SYNC_SECRET}" \
            -H "Content-Type: application/json"
