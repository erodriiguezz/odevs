services:
  - type: web
    name: odevs-api
    runtime: node
    rootDir: apps/api
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SYNC_SECRET
        sync: false